<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório de ensaio</title>
  <style>
    :root {
      --azul-900: #071426;
      --azul-800: #0a1c31;
      --azul-700: #102a47;
      --azul-600: #123a63;
      --azul-caixa: #0c2138;
      --borda: #254a75;
      --texto: #eaf1fa;
      --texto-suave: #b6c9de;
      --laranja: #f97316;
      --laranja-escuro: #c2410c;
      --verde: #34d399;
      --vermelho: #fca5a5;
      --raio: 14px;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1100px 520px at 12% -12%, #12365b 0%, transparent 62%),
        var(--azul-900);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    /* Faixa laranja do topo */
    .faixa {
      background: var(--laranja);
      color: #06152a;
      border-bottom: 4px solid var(--laranja-escuro);
    }

    .faixa__conteudo {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 18px;
    }

    .faixa h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .faixa__subtitulo {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #10233d;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }

    /* Indicador de etapas: 1 Modelo → 2 Fotos → 3 Gerar */
    .etapas {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      padding: 0;
      list-style: none;
    }

    .etapa {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border: 1px solid var(--borda);
      border-radius: 999px;
      background: var(--azul-700);
      color: var(--texto-suave);
      font-size: 14px;
      font-weight: 600;
    }

    .etapa__numero {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      font-size: 14px;
      font-weight: 700;
      color: var(--texto);
    }

    .etapa--atual {
      background: var(--azul-600);
      border-color: var(--laranja);
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.28);
    }

    .etapa--atual .etapa__numero {
      background: var(--laranja);
      color: #06152a;
    }

    .etapa--concluida {
      background: #10332b;
      border-color: #2f7d63;
      color: #d1fae5;
    }

    .etapa--concluida .etapa__numero {
      background: var(--verde);
      color: #062a1c;
    }

    .etapa__seta {
      color: #6d87a6;
      font-size: 18px;
      line-height: 1;
    }

    /* Duas colunas: cartão do arquivo à esquerda, área de arrastar à direita */
    .colunas {
      display: grid;
      grid-template-columns: minmax(260px, 330px) 1fr;
      gap: 20px;
      align-items: start;
    }

    .cartao {
      padding: 20px;
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      background: var(--azul-700);
    }

    .cartao h2,
    .area h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    .selo {
      display: inline-block;
      margin: 0 0 16px;
      padding: 3px 10px;
      border: 1px solid var(--borda);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--texto-suave);
      font-size: 14px;
      font-weight: 600;
    }

    .selo--ok {
      border-color: #2f7d63;
      background: #10332b;
      color: #d1fae5;
    }

    .detalhes {
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .detalhes div {
      display: grid;
      gap: 2px;
    }

    .detalhes dt {
      font-size: 14px;
      font-weight: 600;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .detalhes dd {
      margin: 0;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .area {
      padding: 20px;
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      background: var(--azul-700);
    }

    /* Área de drop */
    .drop {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 10px;
      min-height: 260px;
      padding: 28px 20px;
      border: 2px dashed var(--borda);
      border-radius: var(--raio);
      background: var(--azul-caixa);
      text-align: center;
      cursor: pointer;
      transition: border-color 140ms ease, background-color 140ms ease;
    }

    .drop:hover,
    .drop--ativo {
      border-color: var(--laranja);
      background: #123554;
    }

    .drop:focus-within {
      outline: 3px solid var(--laranja);
      outline-offset: 3px;
    }

    .drop--carregando {
      cursor: progress;
      opacity: 0.85;
    }

    .drop__icone {
      width: 54px;
      height: 54px;
      color: var(--laranja);
    }

    .drop__instrucao {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--texto);
    }

    .drop__dica {
      margin: 0;
      font-size: 16px;
      color: var(--texto-suave);
    }

    .drop__acao {
      margin-top: 6px;
      padding: 10px 18px;
      border: 1px solid var(--laranja);
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.14);
      color: #ffd9bd;
      font-size: 15px;
      font-weight: 700;
    }

    .drop:hover .drop__acao,
    .drop--ativo .drop__acao {
      background: rgba(249, 115, 22, 0.24);
    }

    /* Mantém o input acessível por teclado, sem aparecer na tela */
    .oculto-visual {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Mensagens (erro, carregando, sucesso) */
    .mensagem {
      margin: 16px 0 0;
      padding: 12px 14px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: #132c4a;
      color: var(--texto);
      font-size: 16px;
    }

    .mensagem[hidden] {
      display: none;
    }

    .mensagem--ok {
      border-color: #2f7d63;
      background: #0f3327;
      color: #c9f7e3;
    }

    .mensagem--erro {
      border-color: #8a3548;
      background: #3a1620;
      color: var(--vermelho);
    }

    .mensagem__detalhe {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      color: inherit;
      opacity: 0.9;
    }

    /* Etapa 2 — fotos */
    .fotos {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      background: var(--azul-700);
    }

    .fotos__topo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .fotos__topo h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.2px;
    }

    .contador {
      margin: 0;
      padding: 6px 14px;
      border: 1px solid var(--borda);
      border-radius: 999px;
      background: var(--azul-caixa);
      color: var(--texto);
      font-size: 15px;
      font-weight: 700;
    }

    .contador--cheio {
      border-color: var(--laranja);
      color: #ffd9bd;
    }

    .aviso {
      margin: 0 0 14px;
      font-size: 16px;
      color: var(--texto-suave);
    }

    .aviso[hidden] {
      display: none;
    }

    .drop--compacto {
      min-height: 170px;
      padding: 20px;
    }

    .drop--compacto .drop__icone {
      width: 40px;
      height: 44px;
    }

    .drop--bloqueado {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .drop--bloqueado:hover {
      border-color: var(--borda);
      background: var(--azul-caixa);
    }

    .subtitulo {
      margin: 18px 0 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--texto-suave);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .grade {
      display: grid;
      gap: 14px;
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
    }

    .grade--capa {
      grid-template-columns: minmax(200px, 280px);
    }

    .grade--registros {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    /* Vaga de foto: vazia (tracejada) ou preenchida (miniatura) */
    .vaga {
      display: grid;
      gap: 6px;
      padding: 10px;
      border: 1px dashed var(--borda);
      border-radius: 12px;
      background: var(--azul-caixa);
      color: var(--texto-suave);
      font-size: 14px;
    }

    .vaga--vazia {
      place-content: center;
      min-height: 120px;
      text-align: center;
    }

    .vaga--preenchida {
      border-style: solid;
      border-color: #2f7d63;
      color: var(--texto);
    }

    .vaga__imagem {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #05101f;
      object-fit: contain;
    }

    .vaga--capa .vaga__imagem {
      aspect-ratio: 6.8 / 6.5;
    }

    .vaga--registro .vaga__imagem {
      aspect-ratio: 9.6 / 7.2;
    }

    .vaga__rotulo {
      font-size: 14px;
      font-weight: 700;
      color: var(--texto);
    }

    .vaga--vazia .vaga__rotulo {
      color: var(--texto-suave);
    }

    .vaga__arquivo,
    .vaga__dica {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .vaga__arquivo {
      color: var(--texto-suave);
    }

    @media (max-width: 860px) {
      .colunas {
        grid-template-columns: 1fr;
      }

      .fotos {
        padding: 16px;
      }

      main {
        padding: 20px 16px 40px;
      }

      .faixa__conteudo {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="faixa">
    <div class="faixa__conteudo">
      <h1>Relatório de ensaio</h1>
      <p class="faixa__subtitulo">Inserção de fotos no modelo</p>
    </div>
  </header>

  <main>
    <ol class="etapas" aria-label="Etapas do relatório">
      <li class="etapa etapa--atual" data-etapa="1" aria-current="step">
        <span class="etapa__numero">1</span>
        <span class="etapa__rotulo">Modelo</span>
      </li>
      <li class="etapa__seta" aria-hidden="true">→</li>
      <li class="etapa" data-etapa="2" aria-disabled="true">
        <span class="etapa__numero">2</span>
        <span class="etapa__rotulo">Fotos</span>
      </li>
      <li class="etapa__seta" aria-hidden="true">→</li>
      <li class="etapa" data-etapa="3" aria-disabled="true">
        <span class="etapa__numero">3</span>
        <span class="etapa__rotulo">Gerar</span>
      </li>
    </ol>

    <div class="colunas">
      <section class="cartao" aria-labelledby="titulo-arquivo">
        <h2 id="titulo-arquivo">Arquivo do modelo</h2>
        <p id="cartao-estado" class="selo">Aguardando modelo</p>
        <dl class="detalhes">
          <div>
            <dt>Arquivo</dt>
            <dd id="nome-arquivo">Nenhum modelo carregado</dd>
          </div>
          <div>
            <dt>Aba usada</dt>
            <dd id="nome-aba">—</dd>
          </div>
        </dl>
      </section>

      <section class="area" aria-labelledby="titulo-modelo">
        <h2 id="titulo-modelo">Modelo .xlsx</h2>

        <label id="area-drop" class="drop" for="entrada-arquivo">
          <svg class="drop__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 3v5h5"></path>
            <path d="M12 18v-6"></path>
            <path d="M9.5 14.5 12 12l2.5 2.5"></path>
          </svg>
          <span id="instrucao-drop" class="drop__instrucao">
            Arraste o modelo .xlsx aqui ou clique para escolher
          </span>
          <span class="drop__dica">
            Somente .xlsx · precisa conter a aba “Relatório de ensaio”
          </span>
          <span class="drop__acao" aria-hidden="true">Escolher arquivo</span>
          <input id="entrada-arquivo" class="oculto-visual" type="file" accept=".xlsx">
        </label>

        <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>

        <noscript>
          <p class="mensagem mensagem--erro">
            Ative o JavaScript para carregar o modelo e gerar o relatório.
          </p>
        </noscript>
      </section>
    </div>

    <section id="secao-fotos" class="fotos" aria-labelledby="titulo-fotos">
      <div class="fotos__topo">
        <h2 id="titulo-fotos">Fotos</h2>
        <p id="contador-fotos" class="contador" role="status" aria-live="polite">0 de 8 fotos</p>
      </div>

      <p id="aviso-fotos" class="aviso">
        Carregue o modelo .xlsx para liberar o envio de fotos.
      </p>

      <label id="area-fotos" class="drop drop--compacto drop--bloqueado" for="entrada-fotos">
        <svg class="drop__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <circle cx="8.5" cy="9.5" r="1.5"></circle>
          <path d="m21 16-5-5-9 9"></path>
        </svg>
        <span class="drop__instrucao">Arraste as fotos aqui ou clique para escolher</span>
        <span class="drop__dica">JPG, PNG ou WEBP · a 1ª foto vira a Capa</span>
        <span class="drop__acao" aria-hidden="true">Escolher fotos</span>
        <input id="entrada-fotos" class="oculto-visual" type="file" multiple
               accept="image/jpeg,image/png,image/webp" disabled>
      </label>

      <p id="mensagem-fotos" class="mensagem" role="status" aria-live="polite" hidden></p>

      <h3 class="subtitulo">Capa</h3>
      <ul id="grade-capa" class="grade grade--capa" aria-label="Posição da capa"></ul>

      <h3 class="subtitulo">Registros</h3>
      <ul id="grade-registros" class="grade grade--registros" aria-label="Posições dos registros 1 a 7"></ul>
    </section>
  </main>

  <script src="vendor/exceljs.min.js"></script>
  <script>
    (() => {
      "use strict";

      const ABA_OBRIGATORIA = "Relatório de ensaio";
      const EXTENSAO = ".xlsx";

      // Mesmas regras da função pura validarFotos() de src/layout.js.
      // A página abre direto do disco (file://), então não há módulo ES
      // importável; a lógica abaixo é a cópia validada em tests/.
      const LIMITE_FOTOS = 8;
      const TIPOS_ACEITOS = new Set(["image/jpeg", "image/png", "image/webp"]);
      const TIPO_POR_EXTENSAO = {
        ".jpg": "image/jpeg",
        ".jpeg": "image/jpeg",
        ".png": "image/png",
        ".webp": "image/webp",
      };
      const POSICOES = [
        "Capa",
        "Registro 1",
        "Registro 2",
        "Registro 3",
        "Registro 4",
        "Registro 5",
        "Registro 6",
        "Registro 7",
      ];
      const ERRO_LIMITE = "Máximo de 8 fotos. Envie até 8 imagens.";
      const ERRO_FORMATO = "Formato não aceito: use JPG, PNG ou WEBP.";
      const ERRO_SEM_MODELO = "Carregue o modelo .xlsx antes de adicionar fotos.";

      // RF07/RF08: 300 dpi no tamanho final, com fundo branco.
      // Mesmas fórmulas de cmParaPixels()/tamanhoEmPixels() e escalaContida()
      // de src/layout.js, cobertas por tests/layout.test.js.
      const DPI = 300;
      const QUALIDADE_JPEG = 0.92;
      const TAMANHO_CAPA_CM = { largura: 6.8, altura: 6.5 };
      const TAMANHO_REGISTRO_CM = { largura: 9.6, altura: 7.2 };

      // Áreas confirmadas da aba "Relatório de ensaio" (seção 5 do SPEC).
      // Espelho de AREAS_FOTO de src/layout.js, coberto por tests/layout.test.js.
      const AREAS_FOTO = [
        {
          posicao: "Capa",
          colunaInicio: "G",
          linhaInicio: 10,
          colunaFim: "K",
          linhaFim: 22,
          larguraCm: 8.84,
          alturaCm: 8.94,
        },
        {
          posicao: "Registro 1",
          colunaInicio: "C",
          linhaInicio: 185,
          colunaFim: "I",
          linhaFim: 199,
          larguraCm: 12.44,
          alturaCm: 7.54,
        },
        {
          posicao: "Registro 2",
          colunaInicio: "C",
          linhaInicio: 206,
          colunaFim: "I",
          linhaFim: 220,
          larguraCm: 12.44,
          alturaCm: 7.54,
        },
        {
          posicao: "Registro 3",
          colunaInicio: "C",
          linhaInicio: 221,
          colunaFim: "I",
          linhaFim: 235,
          larguraCm: 12.44,
          alturaCm: 7.49,
        },
        {
          posicao: "Registro 4",
          colunaInicio: "C",
          linhaInicio: 250,
          colunaFim: "I",
          linhaFim: 264,
          larguraCm: 12.44,
          alturaCm: 7.54,
        },
        {
          posicao: "Registro 5",
          colunaInicio: "C",
          linhaInicio: 265,
          colunaFim: "I",
          linhaFim: 279,
          larguraCm: 12.44,
          alturaCm: 7.54,
        },
        {
          posicao: "Registro 6",
          colunaInicio: "C",
          linhaInicio: 294,
          colunaFim: "I",
          linhaFim: 308,
          larguraCm: 12.44,
          alturaCm: 7.54,
        },
        {
          posicao: "Registro 7",
          colunaInicio: "C",
          linhaInicio: 309,
          colunaFim: "I",
          linhaFim: 323,
          larguraCm: 12.44,
          alturaCm: 7.54,
        },
      ];

      // Unidades da âncora do ExcelJS (seção 5 do SPEC):
      // 1 cm = 360 000 EMU e 1 px de 96 dpi = 9 525 EMU.
      const PX_POR_CM = 96 / 2.54;
      const EMU_POR_PX = 9525;

      const areaDrop = document.getElementById("area-drop");
      const entradaArquivo = document.getElementById("entrada-arquivo");
      const mensagem = document.getElementById("mensagem");
      const nomeArquivo = document.getElementById("nome-arquivo");
      const nomeAba = document.getElementById("nome-aba");
      const cartaoEstado = document.getElementById("cartao-estado");
      const etapas = Array.from(document.querySelectorAll(".etapa"));

      const areaFotos = document.getElementById("area-fotos");
      const entradaFotos = document.getElementById("entrada-fotos");
      const mensagemFotos = document.getElementById("mensagem-fotos");
      const contadorFotos = document.getElementById("contador-fotos");
      const avisoFotos = document.getElementById("aviso-fotos");
      const gradeCapa = document.getElementById("grade-capa");
      const gradeRegistros = document.getElementById("grade-registros");

      // Só leitura nesta fase (RF11). O ArrayBuffer fica guardado para as
      // próximas etapas (fotos e geração), sem tocar no arquivo de origem.
      const estado = {
        modelo: null,
        carregando: false,
        fotosHabilitadas: false,
        processandoFotos: false,
        fotos: [],
      };

      /** Deixa a próxima pintura acontecer antes de uma tarefa pesada. */
      function aguardarPintura() {
        return new Promise((resolver) => requestAnimationFrame(() => resolver()));
      }

      /** Converte cm em pixels na resolução final (300 dpi). */
      function cmParaPixels(cm) {
        return Math.round((cm / 2.54) * DPI);
      }

      /** Tamanho final em cm da posição: capa ou registro. */
      function tamanhoFinalCm(indice) {
        return indice === 0 ? TAMANHO_CAPA_CM : TAMANHO_REGISTRO_CM;
      }

      /**
       * Converte a letra da coluna (A, G, AA) no índice 0-based do ExcelJS.
       * Mesma regra de letraParaIndice() de src/layout.js.
       */
      function letraParaIndice(letra) {
        const texto = String(letra).trim().toUpperCase();

        if (!/^[A-Z]+$/.test(texto)) {
          throw new Error(`Coluna inválida: ${letra}`);
        }

        let indice = 0;

        for (const caractere of texto) {
          indice = indice * 26 + (caractere.charCodeAt(0) - 64);
        }

        return indice - 1;
      }

      /**
       * Largura de uma coluna em pixels com a fonte padrão Calibri 11.
       * Mesma regra de larguraColunaEmPixels() de src/layout.js.
       */
      function larguraColunaEmPixels(larguraEmCaracteres) {
        return Math.round(larguraEmCaracteres * 7) + 5;
      }

      /**
       * Altura de uma linha em pixels de 96 dpi (o Excel guarda em pontos).
       * Mesma regra de alturaLinhaEmPixels() de src/layout.js.
       */
      function alturaLinhaEmPixels(alturaEmPontos) {
        return Math.round((alturaEmPontos * 96) / 72);
      }

      /**
       * Grade real da área na planilha, em pixels, a partir da primeira
       * célula. Usa as larguras/alturas gravadas no modelo; quando ausentes,
       * aplica os padrões do Excel (coluna de 8,43 caracteres e linha de 15 pt).
       */
      function gradeDaArea(planilha, area) {
        const colunaInicio = letraParaIndice(area.colunaInicio) + 1;
        const colunaFim = letraParaIndice(area.colunaFim) + 1;
        const larguraPadrao = planilha.properties.defaultColWidth || 8.43;
        const alturaPadrao = planilha.properties.defaultRowHeight || 15;

        const colunas = [];
        for (let coluna = colunaInicio; coluna <= colunaFim; coluna += 1) {
          const largura = planilha.getColumn(coluna).width;
          colunas.push(larguraColunaEmPixels(largura == null ? larguraPadrao : largura));
        }

        const linhas = [];
        for (let linha = area.linhaInicio; linha <= area.linhaFim; linha += 1) {
          const altura = planilha.getRow(linha).height;
          linhas.push(alturaLinhaEmPixels(altura == null ? alturaPadrao : altura));
        }

        return { colunas, linhas };
      }

      /**
       * Âncora do ExcelJS que centraliza a foto na área (seção 5 do SPEC).
       * Mesma regra de calcularAncora() de src/layout.js: o ponto centralizado
       * é convertido de cm para pixels e percorre a grade real da planilha,
       * porque o Excel limita o deslocamento ao tamanho da célula da âncora.
       */
      function calcularAncora(area, tamanhoFotoCm, grade) {
        let xPx = ((area.larguraCm - tamanhoFotoCm.largura) / 2) * PX_POR_CM;
        let yPx = ((area.alturaCm - tamanhoFotoCm.altura) / 2) * PX_POR_CM;
        let coluna = letraParaIndice(area.colunaInicio);
        let linha = area.linhaInicio - 1;

        for (const largura of grade.colunas) {
          if (xPx < largura) {
            break;
          }
          xPx -= largura;
          coluna += 1;
        }

        for (const altura of grade.linhas) {
          if (yPx < altura) {
            break;
          }
          yPx -= altura;
          linha += 1;
        }

        return {
          coluna,
          linha,
          deslocamentoXEmu: Math.round(xPx * EMU_POR_PX),
          deslocamentoYEmu: Math.round(yPx * EMU_POR_PX),
          larguraPx: Math.round(tamanhoFotoCm.largura * PX_POR_CM),
          alturaPx: Math.round(tamanhoFotoCm.altura * PX_POR_CM),
        };
      }

      /**
       * Carrega a imagem via <img> + blob URL, usada quando o ambiente não
       * suporta createImageBitmap (ou a opção imageOrientation falha).
       * O navegador atual já aplica a orientação EXIF por padrão em <img>
       * (image-orientation: from-image), então a rotação é preservada.
       */
      function decodificarComImagem(arquivo) {
        return new Promise((resolver, rejeitar) => {
          const url = URL.createObjectURL(arquivo);
          const imagem = new Image();

          imagem.decoding = "async";
          imagem.style.setProperty("image-orientation", "from-image");

          imagem.onload = () => {
            resolver({
              fonte: imagem,
              largura: imagem.naturalWidth,
              altura: imagem.naturalHeight,
              liberar: () => URL.revokeObjectURL(url),
            });
          };

          imagem.onerror = () => {
            URL.revokeObjectURL(url);
            rejeitar(new Error("Não foi possível decodificar a imagem"));
          };

          imagem.src = url;
        });
      }

      /**
       * Decodifica a imagem com createImageBitmap (RF07) e cai para <img>
       * quando a API não existe ou rejeita a opção imageOrientation.
       * @returns {Promise<{ fonte: CanvasImageSource, largura: number,
       *   altura: number, liberar: () => void }>}
       */
      async function decodificarImagem(arquivo) {
        if (typeof createImageBitmap === "function") {
          try {
            const bitmap = await createImageBitmap(arquivo, { imageOrientation: "from-image" });

            return {
              fonte: bitmap,
              largura: bitmap.width,
              altura: bitmap.height,
              liberar: () => bitmap.close(),
            };
          } catch (erro) {
            console.warn(
              "createImageBitmap indisponível para esta imagem; usando <img> como alternativa.",
              erro
            );
          }
        }

        return decodificarComImagem(arquivo);
      }

      /**
       * RF07 + RF08: aplica a orientação EXIF, ajusta a foto inteira no
       * canvas no tamanho final a 300 dpi, centraliza com fundo branco e
       * exporta em JPEG.
       * @returns {Promise<{ blob: Blob, buffer: ArrayBuffer, url: string,
       *   largura: number, altura: number, larguraOrig: number, alturaOrig: number }>}
       */
      async function processarFoto(arquivo, indice) {
        const imagem = await decodificarImagem(arquivo);

        try {
          const tamanhoCm = tamanhoFinalCm(indice);
          const largura = cmParaPixels(tamanhoCm.largura);
          const altura = cmParaPixels(tamanhoCm.altura);

          const canvas = document.createElement("canvas");
          canvas.width = largura;
          canvas.height = altura;

          const contexto = canvas.getContext("2d");
          contexto.fillStyle = "#ffffff";
          contexto.fillRect(0, 0, largura, altura);

          // "Contain": mesma escala nos dois eixos, sem cortar nem distorcer.
          const escala = Math.min(largura / imagem.largura, altura / imagem.altura);
          const desenhoLargura = imagem.largura * escala;
          const desenhoAltura = imagem.altura * escala;

          contexto.imageSmoothingEnabled = true;
          contexto.imageSmoothingQuality = "high";
          contexto.drawImage(
            imagem.fonte,
            (largura - desenhoLargura) / 2,
            (altura - desenhoAltura) / 2,
            desenhoLargura,
            desenhoAltura
          );

          const blob = await new Promise((resolver, rejeitar) => {
            canvas.toBlob(
              (resultado) => {
                if (resultado) {
                  resolver(resultado);
                } else {
                  rejeitar(new Error("Falha ao exportar a imagem"));
                }
              },
              "image/jpeg",
              QUALIDADE_JPEG
            );
          });

          return {
            blob,
            buffer: await blob.arrayBuffer(),
            url: URL.createObjectURL(blob),
            largura,
            altura,
            larguraOrig: imagem.largura,
            alturaOrig: imagem.altura,
          };
        } finally {
          imagem.liberar();
        }
      }

      /**
       * Atualiza o indicador de etapas.
       * Etapas anteriores ficam concluídas, a indicada fica atual e as
       * seguintes ficam bloqueadas.
       */
      function definirEtapa(numeroAtual) {
        etapas.forEach((etapa) => {
          const numero = Number(etapa.dataset.etapa);
          const concluida = numero < numeroAtual;
          const atual = numero === numeroAtual;

          etapa.classList.toggle("etapa--concluida", concluida);
          etapa.classList.toggle("etapa--atual", atual);
          etapa.querySelector(".etapa__numero").textContent = concluida ? "✓" : String(numero);
          etapa.setAttribute("aria-disabled", String(numero > numeroAtual));

          if (atual) {
            etapa.setAttribute("aria-current", "step");
          } else {
            etapa.removeAttribute("aria-current");
          }
        });
      }

      /** Mostra uma mensagem em texto claro na tela. */
      function mostrarMensagemEm(elemento, tipo, texto, detalhe) {
        elemento.className = `mensagem mensagem--${tipo}`;
        elemento.setAttribute("role", tipo === "erro" ? "alert" : "status");
        elemento.replaceChildren();

        elemento.append(document.createTextNode(texto));

        if (detalhe) {
          const linha = document.createElement("span");
          linha.className = "mensagem__detalhe";
          linha.textContent = detalhe;
          elemento.append(linha);
        }

        elemento.hidden = false;
      }

      function limparMensagemEm(elemento) {
        elemento.hidden = true;
        elemento.replaceChildren();
      }

      function formatarTamanho(bytes) {
        const unidades = ["B", "KB", "MB", "GB"];
        let valor = bytes;
        let indice = 0;

        while (valor >= 1024 && indice < unidades.length - 1) {
          valor /= 1024;
          indice += 1;
        }

        const numero = valor.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
        return `${numero} ${unidades[indice]}`;
      }

      /** Reflete o estado do modelo no cartão da esquerda. */
      function atualizarCartao() {
        if (estado.modelo) {
          cartaoEstado.textContent = "Modelo validado";
          cartaoEstado.className = "selo selo--ok";
          nomeArquivo.textContent = `${estado.modelo.nome} (${formatarTamanho(estado.modelo.tamanho)})`;
          nomeAba.textContent = ABA_OBRIGATORIA;
          return;
        }

        cartaoEstado.textContent = "Aguardando modelo";
        cartaoEstado.className = "selo";
        nomeArquivo.textContent = "Nenhum modelo carregado";
        nomeAba.textContent = "—";
      }

      /** Descarta o modelo atual e volta para a etapa 1. */
      function redefinirModelo() {
        estado.modelo = null;
        atualizarCartao();
        habilitarFotos(false);
        limparMensagemEm(mensagemFotos);
        definirEtapa(1);
      }

      /** Libera ou bloqueia o envio de fotos conforme o modelo (RF03). */
      function habilitarFotos(habilitado) {
        estado.fotosHabilitadas = habilitado;
        areaFotos.classList.toggle("drop--bloqueado", !habilitado);
        areaFotos.setAttribute("aria-disabled", String(!habilitado));
        entradaFotos.disabled = !habilitado;
        avisoFotos.hidden = habilitado;
      }

      /** Descobre o tipo aceito da imagem; vazio quando o formato não serve. */
      function tipoDaImagem(arquivo) {
        const tipo = (arquivo.type || "").toLowerCase();

        if (tipo) {
          return TIPOS_ACEITOS.has(tipo) ? tipo : "";
        }

        // Alguns navegadores não informam o MIME ao arrastar do sistema.
        const nome = (arquivo.name || "").toLowerCase();
        const ponto = nome.lastIndexOf(".");
        return ponto < 0 ? "" : TIPO_POR_EXTENSAO[nome.slice(ponto)] || "";
      }

      /** Monta a vaga de uma posição: tracejada vazia ou com miniatura. */
      function criarVaga(indice, foto) {
        const item = document.createElement("li");
        item.className = `vaga vaga--${indice === 0 ? "capa" : "registro"}`;

        if (!foto) {
          item.classList.add("vaga--vazia");

          const rotulo = document.createElement("span");
          rotulo.className = "vaga__rotulo";
          rotulo.textContent = POSICOES[indice];

          const dica = document.createElement("span");
          dica.className = "vaga__dica";
          dica.textContent = "Sem foto";

          item.append(rotulo, dica);
          return item;
        }

        item.classList.add("vaga--preenchida");

        const imagem = document.createElement("img");
        imagem.className = "vaga__imagem";
        imagem.src = foto.url;
        imagem.alt = `${POSICOES[indice]}: ${foto.nome}`;

        const rotulo = document.createElement("span");
        rotulo.className = "vaga__rotulo";
        rotulo.textContent = POSICOES[indice];

        const arquivo = document.createElement("span");
        arquivo.className = "vaga__arquivo";
        arquivo.textContent = foto.nome;

        item.append(imagem, rotulo, arquivo);
        return item;
      }

      /** Redesenha as 8 posições e o contador "X de 8 fotos". */
      function renderizarFotos() {
        const registros = [];

        for (let indice = 1; indice < LIMITE_FOTOS; indice += 1) {
          registros.push(criarVaga(indice, estado.fotos[indice]));
        }

        gradeCapa.replaceChildren(criarVaga(0, estado.fotos[0]));
        gradeRegistros.replaceChildren(...registros);

        const total = estado.fotos.length;
        contadorFotos.textContent = `${total} de ${LIMITE_FOTOS} fotos`;
        contadorFotos.classList.toggle("contador--cheio", total === LIMITE_FOTOS);
      }

      /**
       * Adiciona um lote de fotos (RF03, RF04, RF05, RF07, RF08).
       * O lote é atômico: se algum formato for inválido, o total passar de 8
       * ou uma imagem falhar no processamento, nada é adicionado.
       */
      async function adicionarFotos(arquivos) {
        if (estado.processandoFotos) {
          return;
        }

        if (!estado.fotosHabilitadas) {
          mostrarMensagemEm(mensagemFotos, "erro", ERRO_SEM_MODELO);
          return;
        }

        if (!arquivos.length) {
          mostrarMensagemEm(
            mensagemFotos,
            "erro",
            "Nenhuma foto recebida. Arraste de 1 a 8 imagens."
          );
          return;
        }

        const total = estado.fotos.length + arquivos.length;

        if (total > LIMITE_FOTOS) {
          const restantes = LIMITE_FOTOS - estado.fotos.length;
          mostrarMensagemEm(
            mensagemFotos,
            "erro",
            ERRO_LIMITE,
            `Você já tem ${estado.fotos.length} de 8 fotos, restam ${restantes} posição(ões) ` +
              `e esta seleção tem ${arquivos.length}. Nenhuma foto foi adicionada.`
          );
          return;
        }

        const tipos = arquivos.map(tipoDaImagem);

        if (tipos.some((tipo) => !tipo)) {
          mostrarMensagemEm(mensagemFotos, "erro", ERRO_FORMATO, "Nenhuma foto foi adicionada.");
          return;
        }

        estado.processandoFotos = true;
        areaFotos.classList.add("drop--carregando");
        areaFotos.setAttribute("aria-busy", "true");
        entradaFotos.disabled = true;
        mostrarMensagemEm(
          mensagemFotos,
          "carregando",
          arquivos.length === 1 ? "Processando 1 foto…" : `Processando ${arquivos.length} fotos…`,
          "Aplicando orientação EXIF, ajuste sem corte e 300 dpi."
        );
        await aguardarPintura();

        const processadas = [];

        try {
          for (let indice = 0; indice < arquivos.length; indice += 1) {
            const posicao = estado.fotos.length + indice;
            const resultado = await processarFoto(arquivos[indice], posicao);

            processadas.push({
              nome: arquivos[indice].name || POSICOES[posicao],
              tipo: "image/jpeg",
              tipoOriginal: tipos[indice],
              extensao: "jpeg",
              tamanhoOriginal: arquivos[indice].size,
              ...resultado,
            });
          }
        } catch (erro) {
          // Nada entra na grade se uma imagem do lote falhar.
          processadas.forEach((foto) => URL.revokeObjectURL(foto.url));
          console.error(erro);
          mostrarMensagemEm(
            mensagemFotos,
            "erro",
            "Não foi possível processar uma das imagens.",
            "Use um arquivo JPG, PNG ou WEBP íntegro. Nenhuma foto foi adicionada."
          );
          return;
        } finally {
          estado.processandoFotos = false;
          areaFotos.classList.remove("drop--carregando");
          areaFotos.removeAttribute("aria-busy");
          entradaFotos.disabled = !estado.fotosHabilitadas;
        }

        estado.fotos.push(...processadas);
        renderizarFotos();

        const adicionadas = processadas.length;
        mostrarMensagemEm(
          mensagemFotos,
          "ok",
          adicionadas === 1 ? "1 foto adicionada." : `${adicionadas} fotos adicionadas.`,
          `Posições preenchidas em ordem: ${POSICOES.slice(0, estado.fotos.length).join(", ")}.`
        );
      }

      /**
       * Mede a área real da planilha em cm a partir da grade em pixels.
       * No modelo da empresa a medida confere com a seção 5 do SPEC; no
       * modelo de exemplo as linhas padrão deixam a capa mais baixa que a
       * medida nominal, então prevalece a área real para a foto não cruzar
       * as bordas da área (pendência P1 do SPEC).
       */
      function areaEmCm(grade) {
        return {
          larguraCm: grade.colunas.reduce((total, largura) => total + largura, 0) / PX_POR_CM,
          alturaCm: grade.linhas.reduce((total, altura) => total + altura, 0) / PX_POR_CM,
        };
      }

      /**
       * Carrega uma cópia do modelo em memória e insere as fotos processadas
       * na aba "Relatório de ensaio" (RF09, RF11 e seção 5 do SPEC).
       * Só imagens são adicionadas: nenhuma célula, fórmula ou aba é alterada.
       * Posições sem foto ficam vazias, sem erro.
       * @returns {Promise<ExcelJS.Workbook>}
       */
      async function montarRelatorio() {
        if (!estado.modelo) {
          throw new Error(ERRO_SEM_MODELO);
        }

        if (!estado.fotos.length) {
          throw new Error("Adicione pelo menos 1 foto antes de gerar o relatório.");
        }

        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(estado.modelo.buffer);

        const planilha = workbook.getWorksheet(ABA_OBRIGATORIA);

        if (!planilha) {
          throw new Error(`Arquivo inválido: aba '${ABA_OBRIGATORIA}' não encontrada.`);
        }

        estado.fotos.forEach((foto, indice) => {
          const area = AREAS_FOTO[indice];
          const grade = gradeDaArea(planilha, area);
          const ancora = calcularAncora(
            { ...area, ...areaEmCm(grade) },
            tamanhoFinalCm(indice),
            grade
          );
          const imageId = workbook.addImage({
            buffer: foto.buffer,
            extension: foto.extensao || "jpeg",
            name: `foto-${indice}`,
          });

          planilha.addImage(imageId, {
            tl: {
              nativeCol: ancora.coluna,
              nativeColOff: ancora.deslocamentoXEmu,
              nativeRow: ancora.linha,
              nativeRowOff: ancora.deslocamentoYEmu,
            },
            ext: { width: ancora.larguraPx, height: ancora.alturaPx },
            editAs: "oneCell",
          });
        });

        return workbook;
      }

      /**
       * Lê o .xlsx e valida a aba "Relatório de ensaio" (RF01 e RF02).
       * O arquivo é apenas lido; nada é gravado.
       */
      async function carregarModelo(arquivo) {
        if (estado.carregando || !arquivo) {
          return;
        }

        // Permite escolher o mesmo arquivo de novo depois de um erro.
        entradaArquivo.value = "";

        const nome = arquivo.name || "";

        if (!nome.toLowerCase().endsWith(EXTENSAO)) {
          redefinirModelo();
          mostrarMensagemEm(mensagem, "erro", "Arquivo inválido: use um arquivo .xlsx.");
          return;
        }

        if (typeof ExcelJS === "undefined" || typeof ExcelJS.Workbook !== "function") {
          mostrarMensagemEm(mensagem,
            "erro",
            "Não foi possível carregar a biblioteca de planilhas.",
            "Confirme se a pasta vendor/ acompanha o index.html."
          );
          return;
        }

        estado.carregando = true;
        areaDrop.classList.add("drop--carregando");
        areaDrop.setAttribute("aria-busy", "true");
        mostrarMensagemEm(mensagem, "carregando", `Lendo “${nome}”…`);
        await aguardarPintura();

        try {
          const buffer = await arquivo.arrayBuffer();
          const workbook = new ExcelJS.Workbook();
          await workbook.xlsx.load(buffer);

          const abas = workbook.worksheets.map((aba) => aba.name);

          if (!abas.includes(ABA_OBRIGATORIA)) {
            redefinirModelo();
            mostrarMensagemEm(mensagem,
              "erro",
              `Arquivo inválido: aba '${ABA_OBRIGATORIA}' não encontrada.`,
              `Abas encontradas: ${abas.length ? abas.join(", ") : "nenhuma"}.`
            );
            return;
          }

          estado.modelo = {
            nome,
            tamanho: arquivo.size,
            buffer,
            abas,
          };

          atualizarCartao();
          habilitarFotos(true);
          limparMensagemEm(mensagemFotos);
          definirEtapa(2);
          mostrarMensagemEm(mensagem,
            "ok",
            "Modelo carregado com sucesso.",
            "Próxima etapa liberada: Fotos (de 1 a 8)."
          );
        } catch (erro) {
          console.error(erro);
          redefinirModelo();
          mostrarMensagemEm(mensagem,
            "erro",
            "Arquivo inválido: não foi possível ler o .xlsx.",
            "Verifique se o arquivo está íntegro e não está protegido por senha."
          );
        } finally {
          estado.carregando = false;
          areaDrop.classList.remove("drop--carregando");
          areaDrop.removeAttribute("aria-busy");
          entradaArquivo.value = "";
        }
      }

      entradaArquivo.addEventListener("change", () => {
        carregarModelo(entradaArquivo.files && entradaArquivo.files[0]);
      });

      ["dragenter", "dragover"].forEach((tipo) => {
        areaDrop.addEventListener(tipo, (evento) => {
          evento.preventDefault();
          evento.stopPropagation();
          if (!estado.carregando) {
            areaDrop.classList.add("drop--ativo");
          }
        });
      });

      areaDrop.addEventListener("dragleave", (evento) => {
        evento.preventDefault();
        if (!areaDrop.contains(evento.relatedTarget)) {
          areaDrop.classList.remove("drop--ativo");
        }
      });

      areaDrop.addEventListener("drop", (evento) => {
        evento.preventDefault();
        evento.stopPropagation();
        areaDrop.classList.remove("drop--ativo");

        if (estado.carregando) {
          return;
        }

        const arquivos = evento.dataTransfer ? Array.from(evento.dataTransfer.files) : [];

        if (!arquivos.length) {
          mostrarMensagemEm(mensagem, "erro", "Nenhum arquivo recebido. Arraste um arquivo .xlsx.");
          return;
        }

        carregarModelo(arquivos[0]);
      });

      // Evita que o navegador abra o arquivo quando ele é solto fora da área.
      // Fotos: seleção por input e arrastar e soltar (RF03)
      entradaFotos.addEventListener("change", () => {
        const arquivos = entradaFotos.files ? Array.from(entradaFotos.files) : [];
        entradaFotos.value = "";
        adicionarFotos(arquivos);
      });

      areaFotos.addEventListener("click", (evento) => {
        if (!estado.fotosHabilitadas) {
          evento.preventDefault();
          mostrarMensagemEm(mensagemFotos, "erro", ERRO_SEM_MODELO);
        }
      });

      ["dragenter", "dragover"].forEach((tipo) => {
        areaFotos.addEventListener(tipo, (evento) => {
          evento.preventDefault();
          evento.stopPropagation();
          if (estado.fotosHabilitadas) {
            areaFotos.classList.add("drop--ativo");
          }
        });
      });

      areaFotos.addEventListener("dragleave", (evento) => {
        evento.preventDefault();
        if (!areaFotos.contains(evento.relatedTarget)) {
          areaFotos.classList.remove("drop--ativo");
        }
      });

      areaFotos.addEventListener("drop", (evento) => {
        evento.preventDefault();
        evento.stopPropagation();
        areaFotos.classList.remove("drop--ativo");

        const arquivos = evento.dataTransfer ? Array.from(evento.dataTransfer.files) : [];
        adicionarFotos(arquivos);
      });

      ["dragover", "drop"].forEach((tipo) => {
        window.addEventListener(tipo, (evento) => {
          if (!areaDrop.contains(evento.target) && !areaFotos.contains(evento.target)) {
            evento.preventDefault();
          }
        });
      });

      limparMensagemEm(mensagem);
      limparMensagemEm(mensagemFotos);
      habilitarFotos(false);
      definirEtapa(1);
      atualizarCartao();
      renderizarFotos();
    })();
  </script>
</body>
</html>
